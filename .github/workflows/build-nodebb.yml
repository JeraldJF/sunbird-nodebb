name: Build and Push NodeBB Docker Image

on:
  push:
    tags:
      - '*'
    branches:
      - '**'

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: nodebb
  # Hardcoded NodeBB version and release tag per request
  NODEBB_VERSION: 'v4.7.1'
  RELEASE_TAG: 'release-8.0.0_RC1'
  BUILD_DOCKER_IMAGE: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build variables
        id: vars
        run: |
          IMAGE_TAG="${{ env.RELEASE_TAG }}_${{ github.run_number }}_${{ env.NODEBB_VERSION }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "nodebb_version=${{ env.NODEBB_VERSION }}" >> $GITHUB_OUTPUT
          echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
          echo "Building NodeBB ${NODEBB_VERSION} as ${IMAGE_TAG}"

      - name: Clone NodeBB repository
        run: |
          git clone --depth=1 https://github.com/NodeBB/NodeBB.git -b ${{ env.NODEBB_VERSION }} NodeBB || true

      - name: Copy build files to NodeBB directory
        run: |
          cp Dockerfile NodeBB/ || true
          cp build.sh NodeBB/ || true
          chmod +x NodeBB/build.sh || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker image
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        working-directory: ./NodeBB
        run: |
          docker build \
            --label "commitHash=$(git rev-parse --short HEAD)" \
            --label "nodebbVersion=${{ steps.vars.outputs.nodebb_version }}" \
            --label "buildNumber=${{ github.run_number }}" \
            -t ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }} \
            -t ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Create metadata file
        run: |
          echo "{\"image_name\": \"${{ env.IMAGE_NAME }}\", \"image_tag\": \"${{ steps.vars.outputs.image_tag }}\", \"nodebb_version\": \"${{ steps.vars.outputs.nodebb_version }}\", \"build_number\": \"${{ github.run_number }}\", \"commit_hash\": \"$(git rev-parse --short HEAD)\"}" > metadata.json
          cat metadata.json

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: metadata.json

      - name: Update summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **NodeBB Version**: ${{ steps.vars.outputs.nodebb_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Image**: \`${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
