name: Build and Push NodeBB Docker Image

on:
  push:
    tags:
      - '*'

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: nodebb
  # Hardcoded NodeBB version and release tag per request
  NODEBB_VERSION: 'v4.7.2'
  RELEASE_TAG: 'release-8.0.0_RC1'
  BUILD_DOCKER_IMAGE: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build variables
        id: vars
        run: |
          IMAGE_TAG=$(echo "${{ github.ref_name }}_$(echo $GITHUB_SHA | cut -c1-7)" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "nodebb_version=${{ env.NODEBB_VERSION }}" >> $GITHUB_OUTPUT
          echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
          echo "Building NodeBB ${NODEBB_VERSION} as ${IMAGE_TAG}"

      - name: Clone NodeBB repository
        run: |
          git clone --depth=1 https://github.com/NodeBB/NodeBB.git -b ${{ env.NODEBB_VERSION }} NodeBB || true

      - name: Copy build files to NodeBB directory
        run: |
          cp Dockerfile NodeBB/ || true
          cp build.sh NodeBB/ || true
          chmod +x NodeBB/build.sh || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        run: |
          IMAGE_NAME="nodebb"
          IMAGE_TAG=${{ steps.vars.outputs.image_tag }}
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          docker build --label "commitHash=$(git rev-parse --short HEAD)" \
            --label "nodebbVersion=${{ steps.vars.outputs.nodebb_version }}" \
            --label "buildNumber=${{ github.run_number }}" \
            -f Dockerfile -t ${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Login Docker Registry
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        run: |
          echo "Pushing Docker image: ${IMAGE_NAME}:${IMAGE_TAG}"
          case "${{ vars.REGISTRY_PROVIDER }}" in
          "gcp")
            echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" | base64 --decode > $HOME/gcloud-key.json
            gcloud auth activate-service-account --key-file=$HOME/gcloud-key.json
            gcloud auth configure-docker ${{ secrets.REGISTRY_NAME }}
            REGISTRY_URL=$(echo "${{ secrets.REGISTRY_URL }}" | tr '[:upper:]' '[:lower:]')
            ;;
          "azure" | "dockerhub")
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_NAME }}" \
              --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            REGISTRY_URL=$(echo "${{ secrets.REGISTRY_URL }}" | tr '[:upper:]' '[:lower:]')
            ;;
          *)
            REPO_NAME_LOWERCASE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            REGISTRY_URL="ghcr.io/$REPO_NAME_LOWERCASE"
            ;;
          esac
          echo "REGISTRY_URL=${REGISTRY_URL}" >> $GITHUB_ENV

      - name: Push Docker image
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        run: |
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}

      - name: Create metadata file
        run: |
          echo "{\"registry_url\": \"${REGISTRY_URL}\", \"image_name\": \"${IMAGE_NAME}\", \"image_tag\": \"${{ steps.vars.outputs.image_tag }}\", \"nodebb_version\": \"${{ steps.vars.outputs.nodebb_version }}\", \"build_number\": \"${{ github.run_number }}\", \"commit_hash\": \"$(git rev-parse --short HEAD)\"}" > metadata.json
          cat metadata.json

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: metadata.json

      - name: Update summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **NodeBB Version**: ${{ steps.vars.outputs.nodebb_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Image**: \`${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
